<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/home_style.css">
</head>
<body>
    
    <main>

        <aside id="menu"> <!-- Menu -->

            <div id="logo"> <!-- Logo -->
                a
            </div>

        </aside>


        <section id="conteudo"> <!-- Conteudo -->

            <div id="coluna1"> <!-- Coluna Esquerda -->

                <div id="primeira_linha_coluna1"> <!-- Primeira Linha Coluna Esquerda -->
                    <h2>Saldo</h2>
                    <p>R$ 2000</p>
                </div>

                <div id="segunda_linha_coluna1"> <!-- Segunda Linha Coluna Esquerda -->

                    <div id="bloco1_coluna1"> <!-- Saldo -->
                        <h2>Renda</h2>
                        <p>R$ 3000</p>
                    </div>

                    <div id="bloco2_coluna1"> <!-- Despesas -->
                        <h2>Despesas</h2>
                        <p>R$ 1000</p>
                    </div>

                </div>

                <div id="terceira_linha_coluna1"> <!-- Terceira Linha Coluna Esquerda -->
                    <canvas id="grafico5"></canvas>
                </div>

            </div>


            <div id="coluna2"> <!-- Coluna Direita -->

                <div id="primeira_linha_coluna2"> <!-- Primeira Linha Coluna Direita -->
                    
                    <div id="bloco1_coluna2"> <!-- Grafico 1 -->
                        <h2>Despesas do Mês</h2>
                        <canvas id="grafico1"></canvas>
                    </div>

                    <div id="bloco2_coluna2"> <!-- Grafico 2 -->
                        <h2>Investimentos do Mês</h2>
                        <canvas id="grafico2"></canvas>
                    </div>

                </div>

                <div id="segunda_linha_coluna2"> <!-- Segunda Linha Coluna Direita -->
                    <h2>Gastos Recentes</h2>
                    <ul>
                        <li>Carro</li>
                        <li>Moto</li>
                        <li>Casa</li>
                        <li>Cachorro</li>
                        <li>Gato</li>
                    </ul>
                </div>

                <div id="terceira_linha_coluna2"> <!-- Terceira Linha Coluna Direita -->
                    <canvas id="grafico6"></canvas>
                </div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/home_script.js"></script>
</body>
</html>
