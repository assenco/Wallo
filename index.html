<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index_style.css">
    <link rel="stylesheet" href="css/responsive_index_style.css" media="screen">

<body>
    
    <header>
        <img src="imagens/logo2.png" class="logo">
    </header>

    <main>
        <h1>Entrar</h1>
        <div class="formulario">
            <input id="input_email" type="text" placeholder="E-mail">

            <input id="input_senha" type="password" placeholder="Senha">
            <hr>
        </div>
        <div class="acoes_formulario">
            <button id="btn_login" class="btn_login">Login</button>
            <a href="cadastro.html" class="link_cadastro">Não possui conta?</a>
        </div>
    </main>

    <script src="js/index_script.js"></script>

</html>
