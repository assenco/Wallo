<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/cadastro_style.css">
    <link rel="stylesheet" href="css/responsive_cadastro_style.css" media="screen">
</head>
<body>

    <header>
        <a href="index.htm"><img src="imagens/logo2.png" class="logo"></a>
    </header>
    
    <main>
        <h1>Bem vindo!</h1>
        <div class="formulario">
            <input id="input_nome" type="text" placeholder="Nome Completo">
            <hr>

            <input id="input_telefone" type="text" placeholder="Telefone">
            <hr>

            <input id="input_email" type="text" placeholder="E-mail">
            <hr>

            <input id="input_senha" type="password" placeholder="Senha">
            <hr>

            <input id="input_confirmar_senha" type="password" placeholder="Confirme a senha">
            <hr>
        </div>
        <div class="acoes_formulario">
            <button id="btn_cadastro" class="btn_cadastro">Cadastrar</button>
            <a href="index.html" class="link_login">Já possui conta?</a>
        </div>
    </main>

    <script src="js/cadastro_script.js"></script>
</body>
</html>
